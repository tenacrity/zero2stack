<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>form</title>
  <style>
    body {
    font-size: 20px;
      background-color:aliceblue;
      display:flex;
      justify-content: center;
      align-items: center;
      height: 100vh;

    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow:black;
      width: 400px;
      text-align: center;
    }
    input, select, button {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid cornsilk;
      font-size: 14px;
    }
    button {
      background-color: purple;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color:blueviolet
    }
    .success {
      color: green;
      margin-top: 10px;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Form</h2>
    <label>Name:</label><br>
    <input type="text" id="NAME" placeholder="first name"><br>
    <label>Phone:</label><br>
    <input type="text" id="phone" placeholder="+91-----------" value="+91"><br>

    <button onclick="submitForm()">Submit</button>

    <p id="message"></p>
    <table id="resultTable" style="display:none;">
      <tr>
        <th>Name</th>
        <th>Phone</th>
      </tr>
      <tr>
        <td id="resultName"></td>
        <td id="resultPhone"></td>
      </tr>
    </table>
  </div>

    
  </div>
</body>
</html>
