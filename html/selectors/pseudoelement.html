<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    <style>
        h1::first-letter{
            color:chocolate
        }
        h1{
            font-size: 100px;

        }
        p::first-line{
            color:red
        }
        p::before
        {
            content:"this is usha";
        }
        p::after{
            content:"this is usha";
        }
        p::selection{
            background-color:crimson ;
            color: white;
        }
        
    </style>
</head>
<body>
   <h1>this is pseudo element selector</h1> 
   <p>
    
   </p>
</body>
</html>
